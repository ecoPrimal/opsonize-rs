[package]
name = "opsonize"
version = "0.1.0"
edition = "2021"
description = "Immune tagging + visitor traces — replaces Python opsonize/svc.py + traces_svc.py"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
